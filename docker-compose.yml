services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: palimpsest
      POSTGRES_USER: palimpsest
      POSTGRES_PASSWORD: palimpsest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: