repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
  
      - id: ruff-check-and-fix
        name: ruff check and fix
        entry: uv run ruff check
        language: system
        types: [python]
        args: [--fix]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]